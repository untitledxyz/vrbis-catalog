name: rebuild manifest
on:
  push:
    branches: [main]
    paths: ['entries/**']
permissions:
  contents: write
jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/build-manifest.mjs
      - name: commit
        run: |
          git config user.name 'vrbis-catalog-bot'
          git config user.email 'noreply@vrbis.xyz'
          git add index.json
          git diff --cached --quiet || git commit -m 'manifest: rebuild'
          git push
